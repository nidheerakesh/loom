<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Loom">
  <title>Loom</title>
  <!-- Warp: the individual threads. Weft: the gold kasavu that crosses and binds them.
       The threads pass over and under alternately — a grid is not a weave, the interlacing is,
       and the interlacing is the whole product thesis: separate capacity becoming one cloth. -->
  <g fill="#26364F">
    <rect x="8"  y="6" width="9" height="84" rx="4.5"/>
    <rect x="25" y="6" width="9" height="84" rx="4.5"/>
    <rect x="42" y="6" width="9" height="84" rx="4.5"/>
    <rect x="59" y="6" width="9" height="84" rx="4.5"/>
    <rect x="76" y="6" width="9" height="84" rx="4.5"/>
  </g>
  <g fill="#C9A227">
    <rect x="4" y="30" width="88" height="9" rx="4.5"/>
    <rect x="4" y="57" width="88" height="9" rx="4.5"/>
  </g>
  <!-- Warp segments redrawn over the weft, alternating per row, to create the over-under. -->
  <g fill="#26364F">
    <rect x="8"  y="30" width="9" height="9"/>
    <rect x="42" y="30" width="9" height="9"/>
    <rect x="76" y="30" width="9" height="9"/>
    <rect x="25" y="57" width="9" height="9"/>
    <rect x="59" y="57" width="9" height="9"/>
  </g>
</svg>
