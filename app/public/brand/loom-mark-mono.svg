<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Loom">
  <title>Loom</title>
  <!-- One-colour version for stamps, favicons and anywhere the gold cannot survive.
       currentColor so it inherits from whatever it sits in. -->
